<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/Logo/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>accseo</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;z-index:9999;background:#b91c1c;color:#fff;padding:20px;width:100%;font-family:monospace;white-space:pre-wrap;';
        d.innerHTML = '<b>RUNTIME ERROR:</b><br/>' + msg + '<br/>' + (err ? err.stack : '');
        document.body.appendChild(d);
      };
      window.addEventListener("unhandledrejection", function(e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;z-index:9999;background:#b91c1c;color:#fff;padding:20px;width:100%;font-family:monospace;white-space:pre-wrap;';
        d.innerHTML = '<b>PROMISE ERROR:</b><br/>' + e.reason;
        document.body.appendChild(d);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
